name: Contacto
id: contacto
boxes:
- sub: Contacto
  title: Escribe a Psico Mycelium
  hs: .015
  align: left
  box:
    cols: 2
    gap_vs: 0
    group_radius: true
    hide_radius: true
    grow: true
  boxes:
  - color: such
    bi: /u/fondo.webp
    alpha: .5
    fit: 1.2
    pd_vs: 1.5
    inputs:
    - type: text
      name: Nombre
      icon: person
      req: true
    - type: mail
      name: Email
      icon: mail
      req: true
    - type: phone
      name: Teléfono
      icon: phone
    - type: select
      name: Motivo
      label: Motivo de consulta
      icon: help
      items:
      - label: Psicoterapia Transpersonal
        key: Psicoterapia Transpersonal
      - label: Preparación e Integración Psicodélica
        key: Preparación e Integración Psicodélica
      - label: Microdosis
        key: Microdosis
      - label: Tarot Evolutivo
        key: Tarot Evolutivo
      - label: Profesionales
        key: Profesionales
      - label: Experiencias / Jornadas
        key: Experiencias
    - type: area
      name: Mensaje
      icon: chat_bubble
      req: true
  - color: dark
    fit: .8
    pd_vs: 1.5
    boxes:
    - md: |
        [[::brand:whatsapp-o:: Escribir por WhatsApp]](https://wa.me/34603205578 "[whatsapp nofollow ga4]")

        - ::mail:: amanda@psicomycelium.com <br>
          *Principal*
        - ::mail:: info@psicomycelium.com <br>
          *Experiencias*
        - ::phone:: [+34 603 20 55 78](tel:+34603205578 "[nofollow ga4]")
    - dots:
      - url: https://www.instagram.com/psico_mycelium/
        label: Instagram
      - url: https://www.tiktok.com/@psico_mycelium
        label: TikTok
      - url: https://www.youtube.com/@psicomycelium
        label: YouTube
