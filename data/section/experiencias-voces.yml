name: Voces del encuentro
if: voces

boxes:
- get:
  - from: voces.title
    to: title
  - from: voces.sub
    to: sub
  - from: voces.md
    to: md
  - from: voces.boxes
    to: boxes
  remap:
  - from: boxes.*.id
  - from: boxes.*.md
  align: left
  box:
    cols: 2.01
    cols_vs: 1.2
    slider: true
    align: center
    hs: 6
    card: true
    gray: true
    btn: hide
    # label: Ver más

get:
- from: voces.boxes
  to: modals
remap:
- from: modals.*.url
modal:
  size: xs
  color: light
  bi: /u/fondo.webp
  alpha: .5
  pd: 3
  pd_vs: 2
  ratio: 1/1
