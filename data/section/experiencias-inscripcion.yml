name: Inscripción
if: inscripcion

boxes:
- get:
  - from: inscripcion.title
    to: title
  - from: inscripcion.sub
    to: sub
  - from: inscripcion.md
    to: md
  - from: inscripcion.boxes
    to: boxes
  align: center
  box:
    cols: 2.01
    cols_vs: 1.2
    gap_vs: 2
    slider: true
    color: light
    bi: /u/fondo.webp
    alpha: .3
    pd_vs: 2
    align: center
    icon_size: 2
    hs: 5
    label: Ver más
- get:
  - from: formulario.inputs
    to: inputs
  form:
    mail: info@psicomycelium.com
    subject: Nueva inscripción · {{ get title }} · {{ year }}
    label: Confirmar Inscripción
    action: https://script.google.com/macros/s/AKfycbwdnwLr0ga7SuqUe1pyqVjNz25PseYxJt5bUJOTf8bBzdoCCyPGU42cvAXFVrJoCI9oPw/exec
