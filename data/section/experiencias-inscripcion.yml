name: Inscripción
if: inscripcion

boxes:
- get:
  - from: inscripcion.title
    to: title
  - from: inscripcion.sub
    to: sub
  - from: inscripcion.md
    to: md
  - from: inscripcion.boxes
    to: boxes
  align: center
  box:
    cols: 2.01
    cols_vs: 1.2
    gap_vs: 2
    slider: true
    color: light
    bi: /u/fondo.webp
    alpha: .3
    pd_vs: 2
    align: center
    icon_size: 2
    hs: 5
    label: Ver más
- get:
  - from: formulario.inputs
    to: inputs
  form:
    mail: info@psicomycelium.com
    subject: Nueva inscripción · {{ get title }} · {{ year }}
    confirm:
      enabled: true
      fields: true
      intro: |
        Bienvenid@ [[Nombre]],

        🌿 ¡Nos alegra mucho darte la bienvenida a PsicoMycelium!

        Tu inscripción está confirmada para las Jornadas sobre Estados Expandidos de Conciencia, que celebraremos los días 9, 10 y 11 de Octubre.

        Muy pronto estarás dentro del grupo de WhatsApp donde iremos compartiendo toda la información práctica necesaria para que puedas preparar tu llegada: ubicación, horarios, programación, qué traer y todos los detalles importantes para disfrutar plenamente de la experiencia.

        Estos son los datos que nos has facilitado:
      notice: |
        ✨ Gracias por formar parte de esta primera edición y por contribuir con tu presencia a cocrear este espacio.

        Nos alegra mucho contar contigo.

        Equipo PsicoMycelium 🌿\
        Jornadas sobre Estados Expandidos de Conciencia
    label: Confirmar Inscripción
    action: https://script.google.com/macros/s/AKfycbwdnwLr0ga7SuqUe1pyqVjNz25PseYxJt5bUJOTf8bBzdoCCyPGU42cvAXFVrJoCI9oPw/exec
