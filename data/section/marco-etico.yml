  md: |
    El cuidado psicológico, la evaluación y la responsabilidad ocupan el centro de cualquier acompañamiento.

    **No se proporcionan, facilitan ni administran sustancias, ni se ofrecen indicaciones sobre su obtención, consumo, dosis o protocolos.** El trabajo se limita al acompañamiento psicológico, la preparación y la integración desde una mirada ética y segura.
