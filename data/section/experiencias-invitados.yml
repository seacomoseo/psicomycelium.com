name: Invitados Mágicos
if: invitados

boxes:
- get:
  - from: invitados.title
    to: title
  - from: invitados.sub
    to: sub
  - from: invitados.md
    to: md
  - from: invitados.boxes
    to: boxes
  remap:
  - from: boxes.*.id
  - from: boxes.*.md
  align: center
  box:
    cols: 2.01
    cols_vs: 1.2
    slider: true
    hs: 6
    card: true
    btn: hide
    # label: Ver más

get:
- from: invitados.boxes
  to: modals
remap:
- from: modals.*.url
- from: modals.*.sub
modal:
  size: xs
  color: light
  bi: /u/fondo.webp
  alpha: .5
  pd: 3
  pd_vs: 2
  ratio: 1/1
  align: center
